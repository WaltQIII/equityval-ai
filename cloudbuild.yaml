# Google Cloud Build configuration for EquityVal AI
# Enforces FinOps Guardrail: --max-instances=3 and $100/month budget circuit breaker in us-east1.

steps:
  # 1. Run backend pytest suite
  - name: 'python:3.12-slim'
    id: 'run-backend-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir -r backend/requirements.txt
        PYTHONPATH=backend pytest backend/tests -v

  # 2. Build backend container image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/equityval-ai-backend:latest'
      - '.'

  # 3. Push backend container image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend-image'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/equityval-ai-backend:latest'

  # 4. Deploy backend to Cloud Run (us-east1, --max-instances=3)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'equityval-ai-backend'
      - '--image=gcr.io/$PROJECT_ID/equityval-ai-backend:latest'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--max-instances=3'
      - '--min-instances=0'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--set-env-vars=GCP_MONTHLY_BUDGET_USD=100.0,CLOUD_RUN_MAX_INSTANCES=3,GCS_UPLOAD_BUCKET=${_GCS_BUCKET}'

substitutions:
  _REGION: 'us-east1'
  _GCS_BUCKET: 'equityval-ai-raw-uploads'

images:
  - 'gcr.io/$PROJECT_ID/equityval-ai-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
